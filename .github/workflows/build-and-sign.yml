name: Build and Sign

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  actions: read

jobs:
  build-and-sign:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Read version
        id: ver
        run: node -e "const fs=require('fs');fs.appendFileSync(process.env.GITHUB_OUTPUT,'version='+require('./package.json').version+'\n')"

      - name: Install dependencies
        run: npm ci

      - name: Build installer
        run: npm run build

      - name: Upload unsigned artifact
        id: upload-unsigned
        uses: actions/upload-artifact@v4
        with:
          name: DanglePet-Setup-${{ github.run_id }}
          path: dist/DanglePet Setup 2.0.0.exe
          if-no-files-found: error

      - name: Submit signing request to SignPath Foundation
        id: signpath
        uses: signpath/github-action-submit-signing-request@v2
        with:
          # Secrets are created once the SignPath Foundation onboarding is done.
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ secrets.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ secrets.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ secrets.SIGNPATH_SIGNING_POLICY_SLUG }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          github-artifact-id: ${{ steps.upload-unsigned.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: ${{ github.workspace }}/signed
          parameters: |
            {
              "version": "${{ steps.ver.outputs.version }}",
              "product": "DanglePet"
            }

      - name: Upload signed artifact
        uses: actions/upload-artifact@v4
        with:
          name: DanglePet-Signed-${{ github.run_id }}
          path: ${{ github.workspace }}/signed

      - name: Attach signed installer to release
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          gh release upload "$GITHUB_REF_NAME" "$GITHUB_WORKSPACE"/signed/*.exe --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}