```yaml
name: Build

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  actions: read

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Read version
        id: ver
        run: node -e "const fs=require('fs');fs.appendFileSync(process.env.GITHUB_OUTPUT,'version='+require('./package.json').version+'\n')"

      - name: Install dependencies
        run: npm ci

      - name: Build installer
        run: npm run build

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: DanglePet-Setup-${{ github.run_id }}
          path: dist/DanglePet Setup 2.0.0.exe
          if-no-files-found: error

      - name: Attach installer to release
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          gh release upload "$GITHUB_REF_NAME" "$GITHUB_WORKSPACE"/dist/*.exe --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
```
