<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100%; height: 100%;
    background: transparent;
    overflow: hidden;
    cursor: default;
    user-select: none;
    -webkit-app-region: no-drag;
  }

  #stage {
    position: relative;
    width: 100%; height: 100%;
    transform-origin: top center;
  }

  .dragging #pet-container,
  .dragging #rope-wrap {
    animation-play-state: paused !important;
  }

  /* --- Window controls (minimize / settings / click-through / close) --- */
  /* The invisible zone enlarges the hover target for revealing the buttons;
     the bar itself only accepts clicks while it is actually visible. */
  #controls-zone {
    position: absolute;
    top: 0;
    right: 0;
    width: 220px;
    height: 92px;
    z-index: 50;
  }
  #controls {
    position: absolute;
    top: 6px;
    right: 8px;
    display: flex;
    gap: 6px;
    padding: 4px 6px;
    border-radius: 20px;
    background: rgba(20, 20, 30, 0.35);
    backdrop-filter: blur(4px);
    opacity: 0;
    transform: translateY(-6px) scale(0.9);
    transition: opacity 0.25s ease, transform 0.25s ease;
    -webkit-app-region: no-drag;
    pointer-events: none;
  }
  #controls-zone:hover #controls, .controls-visible #controls {
    opacity: 1;
    transform: translateY(0) scale(1);
    pointer-events: auto;
  }
  .ctl {
    width: 24px; height: 24px;
    border: none;
    border-radius: 50%;
    font-size: 12px;
    line-height: 1;
    color: #fff;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 2px 6px rgba(0,0,0,0.3);
    transition: transform 0.15s ease, filter 0.15s ease;
    -webkit-app-region: no-drag;
  }
  .ctl:hover { transform: scale(1.18); filter: brightness(1.25); }
  .ctl:active { transform: scale(0.92); }
  #btn-min  { background: linear-gradient(135deg, #48dbfb, #0abde3); }
  #btn-set  { background: linear-gradient(135deg, #feca57, #f39c12); }
  #btn-ct   { background: linear-gradient(135deg, #a29bfe, #6c5ce7); }
  #btn-close{ background: linear-gradient(135deg, #ff6b6b, #ff4757); }

  /* Click-through mode: hide controls entirely */
  body.clickthrough #controls-zone {
    pointer-events: none;
  }
  body.clickthrough #controls {
    opacity: 0;
    transform: translateY(-6px) scale(0.9);
    pointer-events: none;
  }

  /* --- Rope --- */
  #stage {
    --rp1: #cfa36a;
    --rp2: #9e6b38;
    --rpk1: #e9c28a;
    --rpk2: #a9743d;
    --rpk3: #7a471d;
  }
  #rope-wrap {
    position: absolute;
    width: 100%;
    height: 1px;
    z-index: 2;
  }
  #rope-svg {
    position: absolute;
    left: 0; top: 0;
    overflow: visible;
    pointer-events: none;
  }
  #rope-path {
    stroke: var(--rp1);
    stroke-width: calc(3.5px * var(--rope-thick, 1));
    stroke-linecap: round;
  }
  #rope-path2 {
    stroke: var(--rp2);
    stroke-width: calc(3.5px * var(--rope-thick, 1));
    stroke-linecap: round;
    stroke-dasharray: 2 4 4 2;
    opacity: 0.6;
  }
  #knot {
    position: absolute;
    left: 0; top: 0;
    width: 14px; height: 11px;
    margin-left: -7px; margin-top: -5px;
    background: radial-gradient(circle at 32% 26%, var(--rpk1), var(--rpk2) 60%, var(--rpk3) 100%);
    border-radius: 50%;
    box-shadow:
      0 2px 5px rgba(0,0,0,0.45),
      inset 0 -1px 2px rgba(80,40,10,0.55),
      0 1px 0 rgba(255,255,255,0.18);
  }
  /* Move mode (position unlocked): the anchor pulses so you can see the exact
     point that dragging will carry around the screen. */
  #stage.move-mode #knot { animation: anchor-pulse 1.6s ease-in-out infinite; }
  @keyframes anchor-pulse {
    0%, 100% { box-shadow: 0 0 0 3px rgba(72,219,251,0.45), 0 0 10px rgba(72,219,251,0.5), 0 2px 5px rgba(0,0,0,0.45); }
    50%      { box-shadow: 0 0 0 6px rgba(72,219,251,0.22), 0 0 22px rgba(72,219,251,0.75), 0 2px 5px rgba(0,0,0,0.45); }
  }
  #stage.move-mode #pet-container { cursor: move; }
  /* Rope textures: same solver credentials as Hangly-style ropes — each one
     is a different set of values, not just a different picture. */
  #stage.rope-cord #rope-path2 { display: none; }
  #stage.rope-cord #rope-path { stroke-width: calc(3px * var(--rope-thick, 1)); }
  #stage.rope-twist #rope-path2 { stroke-dasharray: 1.5 3; opacity: 0.9; }
  #stage.rope-twist #rope-path { stroke-dasharray: 3 5; opacity: 0.75; }
  #stage.rope-ribbon #rope-path { stroke-width: calc(7px * var(--rope-thick, 1)); }
  #stage.rope-ribbon #rope-path2 { stroke-width: calc(5px * var(--rope-thick, 1)); stroke-dasharray: 10 4; opacity: 0.35; }
  /* Smooth flash when the rope style changes */
  @keyframes rope-fx {
    0%   { filter: brightness(1.7) drop-shadow(0 0 6px rgba(255,255,255,0.5)); }
    100% { filter: brightness(1) drop-shadow(0 0 0 rgba(255,255,255,0)); }
  }
  #stage.rope-swapping #rope-wrap { animation: rope-fx 0.4s ease-out; }

  /* The rig carries the rope-swing transform; the pet animates inside it, so
     both combine smoothly (rotating on the rope while bouncing, etc.). */
  #pet-rig {
    position: absolute;
    left: 0; top: 0;
    transform-origin: 50% 0;
    will-change: transform;
    backface-visibility: hidden;
  }

  #pet-container {
    position: relative;
    width: 100%;
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    transform-origin: 50% 0;
    will-change: transform;
    backface-visibility: hidden;
    /* Pointer events drive dragging; never let touch/pen gestures hijack it. */
    touch-action: none;
  }

  #pet-img {
    max-width: 100%;
    max-height: 100%;
    object-fit: contain;
    filter: drop-shadow(0 10px 14px rgba(0,0,0,0.28));
    transition: filter 0.3s ease;
    image-rendering: auto;
    pointer-events: none;
  }
  #pet-svg-wrapper {
    width: 100%; height: 100%;
    display: flex; align-items: center; justify-content: center;
    filter: drop-shadow(0 10px 14px rgba(0,0,0,0.28));
    transition: filter 0.3s ease;
    pointer-events: none;
  }
  #pet-svg-wrapper svg {
    width: 100%; height: 100%;
    overflow: visible;
  }

  /* --- Mood bubble --- */
  #mood-bubble {
    position: absolute;
    top: -46px; left: 50%;
    transform: translateX(-50%) scale(0);
    background: rgba(255,255,255,0.96);
    border-radius: 22px;
    padding: 5px 14px;
    font-size: 22px;
    box-shadow: 0 6px 18px rgba(0,0,0,0.18);
    pointer-events: none;
    transition: transform 0.35s cubic-bezier(0.34, 1.56, 0.64, 1), opacity 0.35s ease;
    opacity: 0;
    white-space: nowrap;
    z-index: 20;
  }
  #mood-bubble.show {
    transform: translateX(-50%) scale(1);
    opacity: 1;
  }
  #mood-bubble::after {
    content: '';
    position: absolute;
    bottom: -8px; left: 50%;
    transform: translateX(-50%);
    border: 8px solid transparent;
    border-top-color: rgba(255,255,255,0.96);
    border-bottom: 0;
  }

  /* --- Particles --- */
  .particle {
    position: absolute;
    pointer-events: none;
    font-size: 18px;
    z-index: 30;
    animation: particle-fly 1s cubic-bezier(0.25, 0.46, 0.45, 0.94) forwards;
  }
  @keyframes particle-fly {
    0% { opacity: 1; transform: translate(0, 0) scale(1); }
    100% { opacity: 0; transform: translate(var(--dx), var(--dy)) scale(0.3) rotate(var(--rot)); }
  }

  /* --- Ground shadow --- */
  #ground-shadow {
    position: absolute;
    bottom: 8px; left: 50%;
    width: 80px; height: 14px;
    background: radial-gradient(ellipse, rgba(0,0,0,0.22) 0%, transparent 68%);
    border-radius: 50%;
    transition: width 0.3s ease, opacity 0.3s ease;
  }

  /* --- Animations --- */
  .anim-bounce #pet-container { animation: bounce var(--dur) cubic-bezier(0.28, 0.84, 0.42, 1) infinite; }
  .anim-float #pet-container { animation: float var(--dur) ease-in-out infinite; }
  .anim-pulse #pet-container { animation: pulse var(--dur) ease-in-out infinite; }
  .anim-wiggle #pet-container { animation: wiggle calc(var(--dur) * 0.3) ease-in-out infinite; }
  .anim-nod #pet-container { animation: nod var(--dur) ease-in-out infinite; }
  .anim-spin #pet-container { animation: spin calc(var(--dur) * 1.2) linear infinite; }
  .anim-wobble #pet-container { animation: wobble var(--dur) ease-in-out infinite; }
  .anim-shake #pet-container { animation: shake 0.45s cubic-bezier(0.36, 0.07, 0.19, 0.97); }
  .anim-jump #pet-container { animation: jump 0.65s cubic-bezier(0.34, 1.56, 0.64, 1) 1; }
  .anim-punch #pet-container { animation: punch 0.6s cubic-bezier(0.36, 0.07, 0.19, 0.97) 1; }
  .anim-confused #pet-container { animation: headtilt 0.9s ease-in-out 1; }
  .anim-celebrate #pet-container { animation: celebrate 1.1s cubic-bezier(0.34, 1.56, 0.64, 1) 1; }
  .anim-celebrate #ground-shadow { animation: reboundShadow 1.1s ease-out 1; }
  .anim-rebound #pet-container { animation: rebound 0.95s cubic-bezier(0.25, 0.46, 0.45, 0.94) 1; }
  .anim-rebound #ground-shadow { animation: reboundShadow 0.95s ease-out 1; }

  /* Snappy squash "pop" on every click, applied to the whole stage */
  #stage.pop-stage { animation: pop 0.3s cubic-bezier(0.34, 1.56, 0.64, 1) 1; }
  @keyframes pop {
    0%   { transform: translateY(7px) scale(1.14, 0.86); }
    45%  { transform: translateY(-5px) scale(0.93, 1.09); }
    100% { transform: translateY(0) scale(1, 1); }
  }

  /* Expanding ring burst (celebrations) */
  .ring {
    position: absolute;
    pointer-events: none;
    width: 22px; height: 22px;
    border: 3px solid rgba(255, 215, 0, 0.75);
    border-radius: 50%;
    z-index: 29;
    animation: ring-out 0.7s ease-out forwards;
  }
  @keyframes ring-out {
    0% { transform: scale(1); opacity: 0.9; }
    100% { transform: scale(6); opacity: 0; }
  }

  /* Physics-driven dangle replaces the cosmetic swing animation */
  #stage.physics-on .anim-swing #pet-container,
  #stage.physics-on .anim-swing #ground-shadow {
    animation: none;
  }

  @keyframes bounce {
    0%, 100% { transform: translateY(0) scale(1, 1); }
    40% { transform: translateY(-26px) scale(0.98, 1.02); }
    60% { transform: translateY(-28px) scale(0.96, 1.04); }
    80% { transform: translateY(-4px) scale(1.04, 0.96); }
  }
  @keyframes float {
    0%, 100% { transform: translateY(0) rotate(0deg); }
    33% { transform: translateY(-14px) rotate(2deg); }
    66% { transform: translateY(-6px) rotate(-1.5deg); }
  }
  @keyframes pulse {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.12); }
  }
  @keyframes wiggle {
    0%, 100% { transform: rotate(0deg); }
    25% { transform: rotate(-7deg); }
    75% { transform: rotate(7deg); }
  }
  @keyframes nod {
    0%, 100% { transform: rotate(0deg); }
    30% { transform: rotate(14deg); }
    60% { transform: rotate(-5deg); }
  }
  @keyframes spin {
    from { transform: rotate(0deg); }
    to { transform: rotate(360deg); }
  }
  @keyframes rebound {
    0%   { transform: translateY(0) rotate(0deg) scale(1, 1); }
    15%  { transform: translateY(-18px) rotate(-5deg) scale(0.97, 1.03); }
    30%  { transform: translateY(2px) rotate(8deg) scale(1.045, 0.955); }
    45%  { transform: translateY(-4px) rotate(-7deg) scale(0.99, 1.01); }
    62%  { transform: translateY(0.5px) rotate(5deg) scale(1.01, 0.99); }
    78%  { transform: translateY(-1px) rotate(-3deg); }
    100% { transform: translateY(0) rotate(0deg); }
  }
  @keyframes reboundShadow {
    0%, 45%, 100% { opacity: 0.85; }
    15%  { opacity: 0.55; }
    30%  { opacity: 1; }
  }
  @keyframes wobble {
    0%, 100% { transform: rotate(0deg) scale(1); }
    15% { transform: rotate(-14deg) scale(1.06); }
    30% { transform: rotate(9deg) scale(0.97); }
    45% { transform: rotate(-7deg) scale(1.02); }
    60% { transform: rotate(5deg) scale(0.99); }
    75% { transform: rotate(-3deg) scale(1.01); }
  }
  @keyframes shake {
    0%, 100% { transform: translateX(0); }
    20% { transform: translateX(-9px); }
    40% { transform: translateX(9px); }
    60% { transform: translateX(-6px); }
    80% { transform: translateX(6px); }
  }
  @keyframes jump {
    0% { transform: translateY(0) scale(1, 1); }
    20% { transform: translateY(10px) scale(1.12, 0.85); }
    50% { transform: translateY(-44px) scale(0.88, 1.12); }
    80% { transform: translateY(4px) scale(1.06, 0.95); }
    100% { transform: translateY(0) scale(1, 1); }
  }
  @keyframes punch {
    0%   { transform: translateX(0) rotate(0); }
    30%  { transform: translateX(-16px) rotate(-22deg); }
    55%  { transform: translateX(15px) rotate(30deg); }
    70%  { transform: translateX(-10px) rotate(-14deg); }
    85%  { transform: translateX(6px) rotate(8deg); }
    100% { transform: translateX(0) rotate(0); }
  }
  @keyframes headtilt {
    0%, 100% { transform: translateX(0) rotate(0); }
    25% { transform: translateX(-3px) rotate(-18deg); }
    50% { transform: translateX(4px) rotate(10deg); }
    75% { transform: translateX(-2px) rotate(-12deg); }
  }
  @keyframes celebrate {
    0%   { transform: translateY(0) rotate(0deg) scale(1, 1); }
    10%  { transform: translateY(7px) rotate(0deg) scale(1.14, 0.86); }
    35%  { transform: translateY(-40px) rotate(160deg) scale(0.9, 1.12); }
    55%  { transform: translateY(-8px) rotate(360deg) scale(1.08, 0.92); }
    68%  { transform: translateY(0) rotate(0deg) scale(1, 1); }
    80%  { transform: translateY(-7px) rotate(-8deg) scale(1.05, 0.97); }
    92%  { transform: translateY(0) rotate(5deg) scale(0.97, 1.03); }
    100% { transform: translateY(0) rotate(0deg) scale(1, 1); }
  }
</style>
</head>
<body>
<div id="stage">
  <div id="controls-zone">
    <div id="controls">
      <button id="btn-min" class="ctl" title="Minimize to tray">─</button>
      <button id="btn-set" class="ctl" title="Settings">⚙</button>
      <button id="btn-ct" class="ctl" title="Toggle click-through (clicks pass to other apps)">🖱</button>
      <button id="btn-close" class="ctl" title="Quit">✕</button>
    </div>
  </div>

  <div id="rope-wrap">
    <svg id="rope-svg" aria-hidden="true">
      <path id="rope-path" fill="none"/>
      <path id="rope-path2" fill="none"/>
    </svg>
    <div id="knot"></div>
  </div>

  <div id="pet-rig">
    <div id="pet-container">
      <div id="mood-bubble"></div>
      <img id="pet-img" style="display:none" draggable="false" alt="">
      <div id="pet-svg-wrapper" style="display:none"></div>
    </div>
  </div>

  <div id="ground-shadow"></div>
</div>

<script>
(function() {
  const stage = document.getElementById('stage');
  const petRig = document.getElementById('pet-rig');
  const petContainer = document.getElementById('pet-container');
  const petImg = document.getElementById('pet-img');
  const petSvg = document.getElementById('pet-svg-wrapper');
  const moodBubble = document.getElementById('mood-bubble');
  const groundShadow = document.getElementById('ground-shadow');
  const ropeWrap = document.getElementById('rope-wrap');

  let currentAnim = 'swing';
  let baseAnim = 'swing';
  let speed = 1;
  let isDragging = false;
  // Position lock is mirrored from the main process, so the renderer can pick
  // the right drag behavior: locked = tug the pet on the rope (window stays
  // put); unlocked = the window itself follows the mouse, so the pendulum must
  // NOT also fling the pet sideways (that double control fought the cursor).
  let positionUnlocked = false;
  let dragMoved = false;
  let suppressClick = false;
  let activePointerId = null;
  let pressX = 0, pressY = 0;
  let currentX = 0, currentY = 0;
  // Cursor's horizontal position (window coords) during a drag; the locked tug
  // spring tracks this directly so the pet visibly follows the mouse.
  let dragTargetX = 0;
  let totalDrag = 0;
  let frameDt = 0.016;
  let lastClickTime = 0;
  let moodTimeout = null;

  // --- Rope physics (constraint-solved segments, Hangly-style) ---
  const ropeEl = document.getElementById('rope-svg');
  const ropePath = document.getElementById('rope-path');
  const ropePath2 = document.getElementById('rope-path2');
  const knotEl = document.getElementById('knot');
  // Physics runs at a fixed 240 Hz via an accumulator (like Hangly), so the
  // rope feels identical on 60 Hz and 144 Hz displays. Gravity is scaled for
  // the fixed step size.
  const PHYS_DT = 1 / 240;
  let physAcc = 0;
  const ROPE_GRAV = 60000;
  const ropeConfigs = {
    braid:  { segs: 14, rlen: 4.0, damp: 0.9965, grav: 0.95, iters: 10, stretch: 1 },
    cord:   { segs: 18, rlen: 3.1, damp: 0.9950, grav: 1.06, iters: 9, stretch: 1 },
    twist:  { segs: 11, rlen: 5.1, damp: 0.9970, grav: 0.90, iters: 12, stretch: 1 },
    ribbon: { segs: 12, rlen: 4.7, damp: 0.9960, grav: 0.98, iters: 10, stretch: 1 }
  };
  let ropeCfg = ropeConfigs.braid;
  let ropePts = [];
  let ropePrev = [];
  let ropeTicking = false;
  let ropeStill = 0;
  let lastFrame = performance.now();
  let lastDragT = 0;
  let dragVelX = 0;
  let dragVelY = 0;
  let rotateSmooth = 0;
  let shadowSmooth = 0;
  let petSize = 140;
  let lastSizeW = 0;
  let lastSizeH = 0;
  let ropeSegLen = 4;
  // Constraint rest length per link. The chain's total length equals the
  // pendulum arm exactly, so the rope hangs taut and stable — no buckling or
  // micro-jitter from over-long links at rest, and the on-screen length always
  // matches the selected rope length.
  let linkLen = 4;
  let ropeLengthPct = 100;
  let swingA = 0;
  let swingV = 0;
  let leanSmooth = 0;
  let animOffX = 0;
  let animOffY = 0;
  let clampAngle = 0.6;

  /* Full elastic rope: a real spring-mass chain. cfg.segments springs hang from
     a fixed anchor and the dangle rides the LAST node, so every section of the
     cord stretches, compresses, bends and carries the wave on its own — the
     whole rope is elastic, not just a spring bolted to the pet. Forces are SI
     (N / kg / m per s^2) and reach pixels through PX_PER_M, which cancels to
     a = (k/m) * offset_px, so the user-facing numbers behave as advertised.
     Stiff segment springs need short fixed substeps (ELASTIC_DT), which is
     still trivial next to a frame's budget at <=30 nodes. */
  const PX_PER_M = 400;      // pixel scale applied to the user-facing SI parameters
  const ELASTIC_DT = 1 / 2400;
  /* Stability budget for the stiffest mode a distance-spring chain has (the
     per-node checkerboard, which runs at 2x the single-segment frequency, so
     omega*h = 2*sqrt(this)). Segment stiffness is capped to keep that inside
     semi-implicit Euler's limit of 2; the cap is a safety net for the rigid +
     many-segment corner, not the normal path. */
  const STAB_TARGET = 0.2;
  const MIN_SEG_RATIO = 0.45; // a segment may never squash below this share of its rest length
  const COMPRESS_RATIO = 0.3; // rope buckles: it pushes back far more weakly than it pulls
  const HARD_RAMP = 2;        // progressive stiffening approaching the stretch limit
  /* Bending stiffness as a share of a segment spring. Distance springs alone
     happily hold a folded zig-zag (a folded rope can have every segment at
     exactly the right length), so the cord needs a real straightening term or it
     visibly kinks at every node under a sideways pull. Tuned to the lowest
     value that stays smooth from 4 to 30 segments; stiffness scales with
     segment length because curvature, not offset, is what is resisted. */
  const BEND_RATIO = 0.5;
  const BEND_DAMP = 0.35;     // damping ratio of the bend springs
  const NODE_MASS_FLOOR = 0.01; // keeps the wave integrable on very light ropes
  const DRAG_OMEGA = 30;      // how hard the hand pulls the free end (rad/s)
  const DRAG_AMAX = 90000;    // cap on the hand's acceleration (px/s^2)
  let dragTargetY = 0;
  let ropeThick = 1;

  const PHYS = {
    on: true,
    cfg: {
      elasticity: 50,       // stiffness of every segment
      mass: 1,              // dangle mass
      ropeMass: 0.5,        // mass of the rope itself, split across its nodes
      segments: 12,         // number of springs in the cord
      gravity: 9.81,
      damping: 35,
      maxStretch: 200,      // % of its rest length a single segment may reach
      ropeSwing: true,
      ropeBounce: true,
      ropeBending: true,
      ropeCompression: true
    },
    nodes: [],       // {x,y,vx,vy,ax,ay,m,fix}
    restY: [],       // static hanging y per node (analytic, weighted by load)
    restBend: [],    // that pose's deviation from the straight chord
    restMaxRatio: 1, // worst segment's static stretch / rest, vs the stretch limit
    restLen: 100     // total natural length of the cord
  };
  PHYS.defaultCfg = Object.assign({}, PHYS.cfg);

  /* Elastic physics only performs in swing mode (it IS the swing mode's rig);
     every other animation keeps its own offset-based hang. */
  function physEnabledMode() { return baseAnim === 'swing' && currentAnim === 'swing'; }
  function usingElasticRope() { return PHYS.on && physEnabledMode(); }

  function physSegCount() {
    const s = Math.round(PHYS.cfg.segments);
    return isFinite(s) ? Math.max(4, Math.min(30, s)) : 12;
  }
  function physSegRest() { return PHYS.restLen / physSegCount(); }

  function physK() {
    /* Higher elasticity = softer rubber (more stretch per pull); 0 = near-rigid
       cord. 2000 N/m at 0% down to 20 N/m at 100%, then scaled per segment
       below.  a = (k/m) * over_px, so the numbers behave as advertised. */
    return 2000 - (Math.max(0, Math.min(100, PHYS.cfg.elasticity)) / 100) * 1980;
  }
  function physRopeNodeMass() {
    /* Rope mass shared out along the cord. The floor keeps the segment springs
       integrable when a light rope is cut into many segments (a 0.5 kg cord in
       30 pieces would otherwise want a wave far faster than any substep). */
    return Math.max(NODE_MASS_FLOOR, Math.max(0.1, PHYS.cfg.ropeMass) / physSegCount());
  }
  function physNodeMass(i) {
    const n = physSegCount();
    if (i === 0) return 1;             // anchor: fixed, never integrated
    if (i === n) return Math.max(0.1, PHYS.cfg.mass) + physRopeNodeMass();
    return physRopeNodeMass();
  }
  /* Stiffness floor: a very soft cord under many segments stretches so far
     under its own weight that it no longer fits in the window and gets crushed
     against the bottom edge. The static hang is linear in 1/k, so the floor is
     the k at which the sag exactly fills the space that is left over. */
  function physKFitFloor() {
    const n = physSegCount();
    const restTotal = physSegRest() * n;
    const maxHang = stage.clientHeight - petSize - 6;
    if (!(maxHang > restTotal * 1.001)) return 0;
    const g = physGravityPx();
    if (g <= 0) return 0;
    const mSeg = physRopeNodeMass();
    let load = 0;
    for (let i = 0; i < n; i++) load += physNodeMass(n) + mSeg * (n - i - 1);
    return g * load / (maxHang - restTotal);
  }
  function physSegK() {
    /* A chain of N springs in series is N times softer than one spring, so the
       per-segment stiffness is scaled up to keep the whole-cord feel where the
       single-spring rig had it. Then bounded on both sides: capped against the
       substep so even a rigid 30-segment cord stays stable, and floored so a
       very soft one still fits the window. */
    const n = physSegCount();
    const kMax = STAB_TARGET * physRopeNodeMass() / (ELASTIC_DT * ELASTIC_DT);
    const want = physK() * n * 0.9;
    return Math.min(Math.max(want, physKFitFloor()), kMax);
  }
  function physMaxSeg() {
    /* The user's Maximum Stretch, but never tighter than the cord's own static
       stretch under its own weight — a limit below that is not a limit, it is a
       contradiction, and the cord would never come to rest. */
    const want = 1 + (Math.max(100, Math.min(400, PHYS.cfg.maxStretch)) / 100 - 1);
    const floor = (PHYS.restMaxRatio || 1) * 1.02;
    return physSegRest() * Math.max(want, floor);
  }
  function physGravityPx() {
    const g = PHYS.cfg.gravity * PX_PER_M;
    return isFinite(g) && g >= 0 ? g : 0;
  }
  function physDampFrac() { return Math.max(0, Math.min(100, PHYS.cfg.damping)) / 100; }
  function physDampRate() { return physDampFrac() * 6; }
  function physSpringDamp() {
    /* Axial (along-the-rope) damping: bleeds the high-frequency ring out of the
       cord so waves decay, without deadening the slow overall swing. */
    return physDampFrac() * 0.15 * Math.sqrt(physSegK() * physRopeNodeMass());
  }
  function physSag() {
    /* Total static stretch of the cord from the dangle's weight — reported for
       the debug snapshot; the per-node shape lives in physRestPose(). */
    if (physGravityPx() <= 0) return 0;
    return (physGravityPx() * Math.max(0.1, PHYS.cfg.mass)) / (physSegK() / physSegCount());
  }

  /* Static hanging shape. Segment i carries everything below it, so it rests
     slightly longer than its natural length (stretch = weight/k): a real
     hanging cord is a gentle curve, not a ruler-straight line. This is the pose
     the rope falls asleep in and settles back to. */
  function physRestPose() {
    const n = physSegCount();
    const seg = physSegRest();
    const k = physSegK() || 1;
    const g = physGravityPx();
    const mSeg = physRopeNodeMass();
    const restY = [];
    const restBend = [];
    let y = 0;
    for (let i = 0; i <= n; i++) {
      restY.push(y);
      if (i < n) {
        /* Everything hanging below segment i: the remaining rope nodes plus the
           dangle that rides on the very last one. */
        const below = physNodeMass(n) + mSeg * (n - i - 1);
        y += seg + (g * below) / k;
      }
    }
    /* Deviation of each interior node from its neighbours' midpoint at rest:
       the bending springs restore this shape instead of a straight line, so
       bending stiffness never fights the rope's own hanging curve. */
    for (let i = 1; i < n; i++) {
      restBend[i] = (restY[i - 1] + restY[i + 1]) * 0.5 - restY[i];
    }
    PHYS.restY = restY;
    PHYS.restBend = restBend;
    /* How much the cord's own weight stretches its worst-loaded segment at
       rest. The Maximum Stretch limit can never be allowed to sit below this,
       or the cord has no equilibrium to settle into and jitters against the cap
       forever (e.g. Maximum Stretch 100% vs ~107% of gravity sag). */
    let worst = 1;
    for (let i = 0; i < n; i++) {
      const len = restY[i + 1] - restY[i];
      if (len / seg > worst) worst = len / seg;
    }
    PHYS.restMaxRatio = worst;
    return restY;
  }

  /* (Re)build the node chain. When the segment count changes the old shape is
     resampled onto the new node count, so the cord keeps its curve instead of
     snapping straight. */
  function physicsBuildNodes() {
    const n = physSegCount();
    const old = PHYS.nodes;
    const oldN = old.length ? old.length - 1 : 0;
    const restY = physRestPose();
    const ax = ropeAnchorX();
    const nodes = [];
    for (let i = 0; i <= n; i++) {
      const p = { x: ax, y: restY[i], vx: 0, vy: 0, ax: 0, ay: 0, m: 1, fix: i === 0 };
      if (oldN > 0) {
        /* resample the previous cord at t = i/n so a segment change is smooth */
        const t = i / n;
        const f = t * oldN;
        const i0 = Math.min(oldN, Math.floor(f));
        const i1 = Math.min(oldN, i0 + 1);
        const w = f - i0;
        p.x = old[i0].x + (old[i1].x - old[i0].x) * w;
        p.y = old[i0].y + (old[i1].y - old[i0].y) * w;
      }
      nodes.push(p);
    }
    PHYS.nodes = nodes;
  }

  /* Park the whole cord on its static hanging curve. Called on init, on a rope
     length change while everything is settled, and as the NaN rescue. */
  function physicsSnapRest() {
    const n = physSegCount();
    if (PHYS.nodes.length !== n + 1) physicsBuildNodes();
    const restY = physRestPose();
    const ax = ropeAnchorX();
    for (let i = 0; i <= n; i++) {
      const p = PHYS.nodes[i];
      p.x = ax;
      p.y = restY[i];
      p.vx = 0;
      p.vy = 0;
      p.ax = 0;
      p.ay = 0;
      p.m = physNodeMass(i);
      p.fix = i === 0;
    }
  }

  function physLastNode() { return PHYS.nodes[PHYS.nodes.length - 1]; }

  /* Hand the cord back to the classic pendulum when physics turns off: derive
     an equivalent angle from the free end's position so nothing visibly jumps. */
  function physicsSyncToSwing() {
    const last = physLastNode();
    if (!last) return;
    const dx = last.x - ropeAnchorX();
    const dy = Math.max(1, last.y);
    swingA = Math.max(-0.85, Math.min(0.85, Math.atan2(dx, dy)));
    swingV = 0;
    leanSmooth = swingA;
    rotateSmooth = swingA * 180 / Math.PI;
  }

  /* Hard per-segment length limits, as positional constraints rather than very
     stiff forces. A Gauss-Seidel pass like this is unconditionally stable, so
     the cord can never exceed Maximum Stretch nor fold two nodes into each
     other no matter what the sliders are set to — which is exactly the "no
     unlimited compression, no unbounded stretch" requirement. Imposing it as
     force instead needs a ~14x stiffer spring, which is past what a 30-node
     chain's fastest transverse mode can integrate and detonates the cord. */
  function projectLimits(passes) {
    const n = physSegCount();
    const nodes = PHYS.nodes;
    if (nodes.length !== n + 1) return;
    const seg = physSegRest();
    const minD = seg * MIN_SEG_RATIO;
    const maxD = physMaxSeg();
    for (let pass = 0; pass < passes; pass++) {
      for (let i = 0; i < n; i++) {
        const a = nodes[i];
        const b = nodes[i + 1];
        let dx = b.x - a.x;
        let dy = b.y - a.y;
        let d = Math.sqrt(dx * dx + dy * dy);
        if (d < 1e-6) { dx = 0; dy = 1e-3; d = 1e-3; }
        let target = 0;
        if (d > maxD) target = maxD;
        else if (d < minD) target = minD;
        if (!target) continue;
        const wa = a.fix ? 0 : 1 / a.m;
        const wb = b.fix ? 0 : 1 / b.m;
        const wsum = wa + wb;
        if (wsum <= 0) continue;
        const ux = dx / d, uy = dy / d;
        const c = (d - target) / d;
        a.x += dx * c * (wa / wsum);
        a.y += dy * c * (wa / wsum);
        b.x -= dx * c * (wb / wsum);
        b.y -= dy * c * (wb / wsum);
        /* Drop the velocity that drove it past the limit, otherwise the cord
           bounces off the stop forever. */
        const rv = (b.vx - a.vx) * ux + (b.vy - a.vy) * uy;
        const over = d > maxD ? rv : -rv;
        if (over > 0) {
          if (!a.fix) { a.vx += ux * rv * (wa / wsum); a.vy += uy * rv * (wa / wsum); }
          if (!b.fix) { b.vx -= ux * rv * (wb / wsum); b.vy -= uy * rv * (wb / wsum); }
        }
      }
    }
  }

  /* One fixed 1/960 s substep of the whole cord:
       - gravity on every dynamic node (the anchor stays fixed)
       - one spring per segment, applied to BOTH connected nodes
       - optional compression push (buckling rope) with a minimum segment length
       - optional bending springs that hold the cord's hanging shape
       - the hand pulls only the free end; the wave travels up on its own
     Semi-implicit Euler, so energy is conserved well and it stays stable at
     60 Hz and 144 Hz alike. */
  function updateElasticPhysics(h) {
    if (!usingElasticRope()) return;
    const n = physSegCount();
    if (PHYS.nodes.length !== n + 1) { physicsBuildNodes(); physSnapRest(); return; }
    const nodes = PHYS.nodes;
    const seg = physSegRest();
    const maxSeg = physMaxSeg();
    const kSeg = physSegK();
    const gPx = physGravityPx();
    const ax = ropeAnchorX();
    const last = nodes[n];
    const mLast = physNodeMass(n);
    const dampFrac = physDampFrac();
    const damp = physDampRate();
    const cs = physSpringDamp();
    const minSeg = seg * MIN_SEG_RATIO;
    const pushK = kSeg * COMPRESS_RATIO;

    /* Anchor is a hard pin: it is the one node no force can move. */
    nodes[0].x = ax;
    nodes[0].y = 0;
    /* Gravity + force accumulator reset. */
    for (let i = 1; i <= n; i++) {
      const p = nodes[i];
      p.m = physNodeMass(i);
      p.ax = 0;
      p.ay = gPx;
    }

    /* Segment springs. Force is equal and opposite on both nodes, so a pull at
       the bottom travels the whole cord instead of only stretching the end. */
    for (let i = 0; i < n; i++) {
      const a = nodes[i];
      const b = nodes[i + 1];
      const dx = b.x - a.x;
      const dy = b.y - a.y;
      const d = Math.sqrt(dx * dx + dy * dy) || 1e-4;
      const ux = dx / d;
      const uy = dy / d;
      const stretch = d - seg;
      let f = 0;
      if (stretch > 0) {
        /* Tension. A soft linear spring carries the elastic feel; a gentle
           progressive ramp near the limit keeps the cord from feeling like it
           hits a wall. The hard limit itself is a positional projection (see
           projectLimits) — doing it with force alone needs a ~14x stiffer
           spring, which is past what the stiffest transverse mode can integrate
           and blows the cord apart. */
        const t = Math.min(1, stretch / Math.max(1e-4, maxSeg - seg));
        f = kSeg * stretch * (1 + HARD_RAMP * t * t);
      } else if (PHYS.cfg.ropeCompression) {
        /* Buckling rope: a weak push, not a mirror of the tension spring. */
        f = pushK * stretch;
      }
      /* Axial damping. The pair is pulled together with force u*f on a and
         -u*f on b, so the power the damper puts in is -f*(v_b-v_a)·u: a POSITIVE
         f term is what makes it dissipative. (Getting this sign backwards turns
         the damper into an energy source and the cord never stops vibrating.) */
      f += cs * ((b.vx - a.vx) * ux + (b.vy - a.vy) * uy);
      /* f > 0 is tension: each node is pulled TOWARD the other, equal and
         opposite, so the pair is a real spring and momentum is conserved. */
      if (!a.fix) { a.ax += ux * f / a.m; a.ay += uy * f / a.m; }
      if (!b.fix) { b.ax -= ux * f / b.m; b.ay -= uy * f / b.m; }
    }

    /* Bending. Distance springs alone cannot tell a taut rope from one folded
       into a zig-zag (a folded rope can have every segment at exactly the right
       length), so each interior node is sprung back toward the curve its
       neighbours describe. The reaction is shared with those neighbours, which
       keeps the net force at zero — a force on one node alone would inject
       energy and rattle the cord. */
    if (PHYS.cfg.ropeBending) {
      const restBend = PHYS.restBend;
      const kB = kSeg * BEND_RATIO;
      /* Bending damper, scaled off the Damping slider like everything else.
         Without it the transverse zig-zag mode — the fastest mode a distance-
         spring chain has, and the one bending barely resists — rings on almost
         forever and the cord never goes to sleep. */
      const cb = BEND_DAMP * dampFrac * 2 * Math.sqrt(kB * physRopeNodeMass());
      for (let i = 1; i < n; i++) {
        const p = nodes[i];
        const l = nodes[i - 1];
        const r = nodes[i + 1];
        const ex = (l.x + r.x) * 0.5 - p.x;
        const ey = (l.y + r.y) * 0.5 - p.y - (restBend[i] || 0);
        const rvx = (l.vx + r.vx) * 0.5 - p.vx;
        const rvy = (l.vy + r.vy) * 0.5 - p.vy;
        const bx = kB * ex + cb * rvx;
        const by = kB * ey + cb * rvy;
        p.ax += bx / p.m;
        p.ay += by / p.m;
        if (!l.fix) { l.ax -= bx * 0.5 / l.m; l.ay -= by * 0.5 / l.m; }
        if (!r.fix) { r.ax -= bx * 0.5 / r.m; r.ay -= by * 0.5 / r.m; }
      }
    }

    if (positionUnlocked && isDragging) {
      /* Unlocked dragging: the window itself carries the pet under the cursor,
         so the cord must sit still relative to the window (mirrors the classic
         swing's freeze) — just kill momentum, add nothing. */
      for (let i = 1; i <= n; i++) {
        nodes[i].vx *= Math.exp(-8 * h);
        nodes[i].vy *= Math.exp(-8 * h);
      }
    } else if (isDragging) {
      /* The hand grabs only the free end and pulls it toward the cursor with a
         critically-damped follower. The rest of the cord is never teleported:
         the pull travels up through the segment springs, which is what makes
         the elastic wave visible. Mass scales the follow, so a heavy dangle is
         genuinely sluggish. */
      const kd = mLast * DRAG_OMEGA * DRAG_OMEGA;
      let fx = kd * (dragTargetX - last.x);
      let fy = kd * (dragTargetY - last.y);
      const am = Math.sqrt(fx * fx + fy * fy);
      if (am > DRAG_AMAX) { fx = fx / am * DRAG_AMAX; fy = fy / am * DRAG_AMAX; }
      last.ax += fx / mLast;
      last.ay += fy / mLast;
      last.vx *= Math.exp(-2 * h);
      last.vy *= Math.exp(-2 * h);
    } else if (!PHYS.cfg.ropeSwing) {
      /* "Rope swing" off = vertical rubber band: the cord may only stretch and
         bounce up and down, never swing sideways. Every node is re-centered on
         the anchor (weighted toward the tip, which carries the most mass), so
         the whole rope hangs plumb instead of just straightening at the end. */
      for (let i = 1; i <= n; i++) {
        const p = nodes[i];
        const w = (i / n) * (i / n);
        p.ax += (ax - p.x) * (600 * w / p.m);
        p.vx *= Math.exp(-3 * h);
      }
    }

    /* Integrate, keep every node inside the window, then enforce the hard
       per-segment limits (after the move, so the bounds always win). */
    const dmp = damp > 0 ? Math.exp(-damp * h) : 1;
    const W = stage.clientWidth;
    const H = stage.clientHeight;
    const minX = petSize * 0.5;
    const maxX = W - petSize * 0.5;
    const minY = petSize * 0.15;
    const maxY = H - petSize;
    const rb = PHYS.cfg.ropeBounce ? -0.35 : 0;
    for (let i = 1; i <= n; i++) {
      const p = nodes[i];
      p.vx = (p.vx + p.ax * h) * dmp;
      p.vy = (p.vy + p.ay * h) * dmp;
      const sp = Math.sqrt(p.vx * p.vx + p.vy * p.vy);
      if (sp > 2500) { const s = 2500 / sp; p.vx *= s; p.vy *= s; }
      p.x += p.vx * h;
      p.y += p.vy * h;
      /* Defense against pathologically long frames (debugger paused, sleep,
         window drag): a mismatched accumulator can't produce NaN physics. */
      if (!isFinite(p.x) || !isFinite(p.y) || !isFinite(p.vx) || !isFinite(p.vy)) {
        physicsSnapRest();
        return;
      }
      if (i === n) {
        /* The dangle must never clip the transparent window edge. Hard stop
           (ropeBounce off) or a soft -0.35 reflection. */
        if (p.x < minX) { p.x = minX; if (p.vx < 0) p.vx *= rb; }
        else if (p.x > maxX) { p.x = maxX; if (p.vx > 0) p.vx *= rb; }
        if (p.y < minY) { p.y = minY; if (p.vy < 0) p.vy *= rb; }
        else if (p.y > maxY) { p.y = maxY; if (p.vy > 0) p.vy *= rb; }
      } else {
        /* Interior nodes only need to stay on screen. */
        if (p.x < 0) p.x = 0; else if (p.x > W) p.x = W;
        if (p.y < 0) p.y = 0; else if (p.y > H) p.y = H;
      }
    }
    /* Hard Maximum Stretch / minimum link length, applied last so the bounds
       always win over the soft springs. */
    projectLimits(2);

    /* Kill micro-drift at the rest curve so the cord can go back to sleep.
       Thresholds are "imperceptible", not "exact": at 2.5 px/s the tip moves
       0.04 px per frame, so snapping here is invisible, and waiting for a
       perfect analytic rest would leave the solver running for many seconds
       after every flick. */
    if (!isDragging) {
      const restY = PHYS.restY;
      let still = true;
      for (let i = 1; i <= n; i++) {
        const p = nodes[i];
        if (Math.abs(p.x - ax) > 2 || Math.abs(p.y - restY[i]) > 2 ||
            Math.abs(p.vx) > 2.5 || Math.abs(p.vy) > 2.5) { still = false; break; }
      }
      if (still) physicsSnapRest();
    }
  }

  /* Total cord length and the mean segment stretch right now — used to draw
     the rope a touch thinner while it is stretched, like real elastic cord. */
  function physRopeShape() {
    const n = physSegCount();
    const nodes = PHYS.nodes;
    if (nodes.length !== n + 1) return { total: PHYS.restLen, ratio: 1 };
    const seg = physSegRest();
    let total = 0;
    for (let i = 0; i < n; i++) {
      const a = nodes[i];
      const b = nodes[i + 1];
      total += Math.sqrt((b.x - a.x) * (b.x - a.x) + (b.y - a.y) * (b.y - a.y));
    }
    return { total: total, ratio: seg > 0 ? total / (seg * n) : 1 };
  }

  /* Apply a config blob from the settings panel (or persistence on launch).
     Sanitizing matches the main-process sanitize, so either side staying in
     range is guaranteed no matter who sends. */
  function setPhysicsFromIPC(cfg) {
    if (!cfg || typeof cfg !== 'object') return;
    const onWas = PHYS.on;
    const segsWas = physSegCount();
    PHYS.cfg.elasticity = Number.isFinite(cfg.elasticity)
      ? Math.max(0, Math.min(100, cfg.elasticity)) : PHYS.cfg.elasticity;
    PHYS.cfg.mass = Number.isFinite(cfg.mass)
      ? Math.max(0.1, Math.min(10, cfg.mass)) : PHYS.cfg.mass;
    PHYS.cfg.ropeMass = Number.isFinite(cfg.ropeMass)
      ? Math.max(0.1, Math.min(2, cfg.ropeMass)) : PHYS.cfg.ropeMass;
    PHYS.cfg.segments = Number.isFinite(cfg.segments)
      ? Math.max(4, Math.min(30, Math.round(cfg.segments))) : PHYS.cfg.segments;
    PHYS.cfg.gravity = Number.isFinite(cfg.gravity)
      ? Math.max(0, Math.min(30, cfg.gravity)) : PHYS.cfg.gravity;
    PHYS.cfg.damping = Number.isFinite(cfg.damping)
      ? Math.max(0, Math.min(100, cfg.damping)) : PHYS.cfg.damping;
    PHYS.cfg.maxStretch = Number.isFinite(cfg.maxStretch)
      ? Math.max(100, Math.min(400, cfg.maxStretch)) : PHYS.cfg.maxStretch;
    PHYS.cfg.ropeSwing = cfg.ropeSwing === undefined ? PHYS.cfg.ropeSwing : !!cfg.ropeSwing;
    PHYS.cfg.ropeBounce = cfg.ropeBounce === undefined ? PHYS.cfg.ropeBounce : !!cfg.ropeBounce;
    PHYS.cfg.ropeBending = cfg.ropeBending === undefined ? PHYS.cfg.ropeBending : !!cfg.ropeBending;
    PHYS.cfg.ropeCompression = cfg.ropeCompression === undefined
      ? PHYS.cfg.ropeCompression : !!cfg.ropeCompression;
    if (typeof cfg.enabled === 'boolean') PHYS.on = cfg.enabled;

    /* Enable: adopt the rope's current free end as the cord's starting point so
       switching feels instant. Disable: hand the cord home to the pendulum in a
       visually identical pose. */
    if (PHYS.on && !onWas) {
      const L = Math.max(1, ropeSegLen * ropeCfg.segs);
      const nx = ropeAnchorX() + Math.sin(swingA) * L;
      const ny = Math.max(petSize * 0.15, L * Math.cos(swingA));
      const n = physSegCount();
      if (PHYS.nodes.length !== n + 1) physicsBuildNodes();
      /* lay the fresh cord out along the pendulum pose it is taking over from */
      for (let i = 0; i <= n; i++) {
        const t = i / n;
        const p = PHYS.nodes[i];
        p.x = ropeAnchorX() + (nx - ropeAnchorX()) * t;
        p.y = ny * t;
        p.vx = 0;
        p.vy = 0;
      }
    } else if (!PHYS.on && onWas) {
      physicsSyncToSwing();
    }
    /* Segment count or any stiffness/mass change moves the static pose, so
       refresh it; a cord already in motion simply relaxes to the new shape. */
    if (physSegCount() !== segsWas) physicsBuildNodes();
    physRestPose();
    wakeRope();
  }

  function physicsResetConfig() {
    PHYS.cfg = Object.assign({}, PHYS.defaultCfg);
    PHYS.on = true;
    physicsBuildNodes();
    physicsSnapRest();
    wakeRope();
  }

  /* Maximum swing angle that keeps the pet fully inside the window. Beyond
     it the pet would clip through the transparent window's edge. */
  function swingClampA() {
    const L = Math.max(1, ropeSegLen * ropeCfg.segs);
    const half = stage.clientWidth / 2 - petSize * 0.45;
    if (half <= 0) return 0.2;
    return Math.min(0.85, Math.asin(Math.min(1, half / L)));
  }

/* Smooth damped pendulum for the "swing" mode. The rope's free end follows it,
      so the pet sways on a slow, predictable arc instead of the rope solver's
      stiff micro-vibrations. A physically-correct longer rope sways a touch
      slower, keeping the swing natural whatever the rope length.
      While dragging, a stiff target-spring leans the pet against the drag
      direction, so it dangles behind the cursor and swings out on release. */
  function updateSwing(dt) {
    if (baseAnim !== 'swing' || currentAnim !== 'swing') return;
    const L = Math.max(1, ropeSegLen * ropeCfg.segs);
    if (isDragging) {
      /* UNLOCKED drag: the main process moves the window under the cursor, so
         the only thing this branch must NOT do is also fling the pet sideways —
         that double control made the pet fight the mouse. Freeze the pendulum
         exactly where it was grabbed and damp any leftover motion; the window
         carries the pet and the rope takes the slack naturally. */
      if (positionUnlocked) {
        swingV *= Math.exp(-12 * dt);
        return;
      }
      /* LOCKED drag ("tug"): the anchor stays put, so the pet follows the
         cursor's horizontal POSITION (window coords), clamped to the safe arc.
         Position-based tracking reads far more alive than a velocity probe:
         a real mouse swipe moves the cursor tens of pixels instantly while
         smoothed velocity lags, which made the tug feel dead. The stiff spring
         leans the pet toward that target and genuinely stores momentum, so on
         release it hands continuous velocity to the pendulum. */
      const Amax = clampAngle;
      const Lx = Math.max(1, L * Math.sin(Amax));
      const offX = Math.max(-Lx, Math.min(Lx, dragTargetX - stage.clientWidth / 2));
      const target = Math.asin(offX / L);
      leanSmooth += (target - leanSmooth) * Math.min(1, 22 * dt);
      swingV += (leanSmooth - swingA) * 150 * dt;
      swingV *= Math.exp(-3 * dt);
      swingA += swingV * dt;
      /* The free-run bounce only runs after release, so the tug spring could
         push the pet past the window-safe angle on a hard pull, clipping the
         window edge. Soft pin at the arc like the free soft-bounce (retain a
         little energy) so a hard tug doesn't die at the wall — translate the
         tail, keep the motion. */
      if (swingA > Amax) { swingA = Amax; if (swingV > 0) swingV = -swingV * 0.35; }
      else if (swingA < -Amax) { swingA = -Amax; if (swingV < 0) swingV = -swingV * 0.35; }
      return;
    }
    /* Real pendulum: torque from gravity acting on a real (pixel) rope length.
       -sin(angle) keeps large arcs naturally smooth (longer period toward the
       top of the stroke), and the exponential velocity damping lets it settle
       after a few periods instead of stopping dead. */
    const G = 3200; // px/s^2 of gravity on this pixel-length rope
    const om2 = (G / L) * speed; // speed slider scales the swing cadence only
    swingV += (-om2 * Math.sin(swingA)) * dt;
    /* Damping tuned from measured on-screen motion: a flick that starts at
       ~90px sways down through ~25px one period later and is basically at rest
       after 3-4 periods (roughly 6 seconds) — visible natural settling without
       a sluggish, dead-feeling drag. */
    swingV *= Math.exp(-0.8 * dt);
    swingA += swingV * dt;
    /* Soft bounce at the window-safe angle: the rope goes slack briefly and
       the pet drifts back in instead of the velocity snapping to zero (which
       read as a hard, robotic direction change). The reflection bleeds energy
       on every hit, so the wrap never turns into a sustained oscillation. */
    const Afit = clampAngle;
    if (swingA > Afit) { swingA = Afit; if (swingV > 0) swingV = -swingV * 0.35; }
    else if (swingA < -Afit) { swingA = -Afit; if (swingV < 0) swingV = -swingV * 0.35; }
    if (Math.abs(swingA) < 0.004 && Math.abs(swingV) < 0.02) { swingA = 0; swingV = 0; }
  }

  function ropeAnchorX() { return stage.clientWidth / 2; }

  /* Where the pet's top-center hangs: at the rope's end (straight hang), so
     switching between swing and other animations keeps the pet glued to the
     rope instead of teleporting between the rope end and the window bottom.
     Clamped so the pet always stays fully inside the window. */
  function petHangY() {
    return Math.max(40, Math.min(ropeSegLen * ropeCfg.segs, stage.clientHeight - 12 - petSize));
  }

  /* The pet's CSS animation offset (bounce, float, jump...) read from its own
     computed transform once per frame. Cheap (style-only, no layout) and keeps
     the rope pinned to the pet even while animations move it — the old code
     read getBoundingClientRect() inside the physics loop every frame. */
  function updateAnimOffset() {
    const tr = getComputedStyle(petContainer).transform;
    if (!tr || tr === 'none') { animOffX = 0; animOffY = 0; return; }
    let a, b, e, f;
    if (tr.indexOf('matrix3d') === 0) {
      const v = tr.slice(9, -1).split(',').map(Number);
      a = v[0]; b = v[1]; e = v[12]; f = v[13];
    } else {
      const m = tr.match(/matrix\(([^)]+)\)/);
      const v = m ? m[1].split(',').map(Number) : [];
      a = v[0] || 1; b = v[1] || 0; e = v[4] || 0; f = v[5] || 0;
    }
    /* Map the pet's TOP-CENTER through the animation matrix (about the
       container midline, transform-origin 50% 50%), so rotated animations
       (wobble, float) keep the rope attached instead of only tracking the
       translate part. */
    const hw = petSize / 2;
    animOffX = (a - 1) * hw + e;
    animOffY = b * hw + f;
  }

  /* Single source of truth for where the rope meets the pet. In swing mode it
     is the pendulum bob; in every other mode it is the hang point plus the
     animation's own offset. The pet rig, the knot and the rope path all derive
     from this one point, so nothing ever drifts out of sync. */
  function ropeAttach() {
    if (usingElasticRope()) {
      const last = physLastNode();
      if (last) return { x: last.x, y: last.y };
    }
    if (baseAnim === 'swing' && currentAnim === 'swing') {
      const L = ropeSegLen * ropeCfg.segs;
      return { x: ropeAnchorX() + Math.sin(swingA) * L, y: L * Math.cos(swingA) };
    }
    return { x: ropeAnchorX() + animOffX, y: petHangY() + animOffY };
  }

  /* Debug snapshot: one read-only getter exposing the authoritative
     interaction + physics state (interactionMode, drag state, pendulum state,
     rope geometry) to the development test harness. Kept because it is read-
     only and costs nothing when unused. */
  window.__rdDebug = () => JSON.stringify({
    mode: document.body.classList.contains('clickthrough')
      ? 'click-through'
      : (isDragging ? 'dragging' : 'interactive'),
    isDragging,
    positionUnlocked,
    ropeTicking,
    touchState,
    ctHoverActive,
    swingA: +swingA.toFixed(4),
    swingV: +swingV.toFixed(4),
    leanSmooth: +leanSmooth.toFixed(3),
    dragVelX: +dragVelX.toFixed(1),
    l: +(ropeSegLen * ropeCfg.segs).toFixed(1),
    anim: currentAnim,
    base: baseAnim,
    at: { x: +ropeAttach().x.toFixed(1), y: +ropeAttach().y.toFixed(1) },
    petSize,
    ropePct: ropeLengthPct,
    clamp: +swingClampA().toFixed(3),
    elastic: usingElasticRope(),
    physics: {
      on: PHYS.on,
      elasticity: PHYS.cfg.elasticity,
      mass: PHYS.cfg.mass,
      ropeMass: PHYS.cfg.ropeMass,
      segments: physSegCount(),
      gravity: PHYS.cfg.gravity,
      damping: PHYS.cfg.damping,
      maxStretch: PHYS.cfg.maxStretch,
      ropeSwing: PHYS.cfg.ropeSwing,
      ropeBounce: PHYS.cfg.ropeBounce,
      ropeBending: PHYS.cfg.ropeBending,
      ropeCompression: PHYS.cfg.ropeCompression,
      restLen: +PHYS.restLen.toFixed(1),
      segRest: +physSegRest().toFixed(2),
      sag: +physSag().toFixed(1),
      shape: physRopeShape(),
      /* every node's position + its own segment stretch: the proof that the
         whole cord deforms, not just the bottom link */
      nodes: PHYS.nodes.map((p, i) => {
        const q = PHYS.nodes[i - 1];
        const d = q
          ? Math.sqrt((p.x - q.x) * (p.x - q.x) + (p.y - q.y) * (p.y - q.y))
          : 0;
        return [+p.x.toFixed(1), +p.y.toFixed(1), i ? +(d / physSegRest()).toFixed(3) : 0];
      })
    }
  });

  /* Test/inspection hook: lets the harness read the live cord and step the
     solver deterministically instead of guessing from pixels. */
  window.__rdPhys = {
    PHYS: PHYS,
    step: updateElasticPhysics,
    snap: physicsSnapRest,
    build: physicsBuildNodes,
    rest: physRestPose,
    drag: { on: function (v) { isDragging = v; }, x: function (v) { dragTargetX = v; }, y: function (v) { dragTargetY = v; } },
    derived: function () {
      return {
        segRest: physSegRest(),
        k: physK(),
        kSeg: physSegK(),
        kSegWanted: physK() * physSegCount() * 0.9,
        clampBinding: physSegK() < physK() * physSegCount() * 0.9 - 1,
        gPx: physGravityPx(),
        nodeMass: physRopeNodeMass(),
        lastMass: physNodeMass(physSegCount()),
        minSeg: physSegRest() * MIN_SEG_RATIO,
        maxSeg: physMaxSeg(),
        maxSegRatio: +(physMaxSeg() / physSegRest()).toFixed(3),
        restMaxRatio: +(PHYS.restMaxRatio || 1).toFixed(3),
        cs: physSpringDamp(),
        dt: ELASTIC_DT,
        segStability: Math.sqrt(physSegK() / physNodeMass(1)) * ELASTIC_DT,
        /* fastest transverse mode of the chain (checkerboard) */
        bendStability: Math.sqrt(physSegK() * BEND_RATIO / physNodeMass(1)) * ELASTIC_DT,        stage: { w: stage.clientWidth, h: stage.clientHeight, anchor: ropeAnchorX() }
      };
    }
  };

  /* (re)build the segments. Anchor pinned at the top-center; the rope's rest
     length reaches from the top down to just above where the pet hangs, so the
     pet visibly dangles on the rope at the bottom of the window. */
  function initRope() {
    const n = ropeCfg.segs;
    const H = Math.max(200, stage.clientHeight);
    // Rope length = its own setting (51-160% of the natural hang), clamped so
    // the pet always stays fully on-screen no matter what the size is.
    const baseRest = Math.max(60, H - 12 - petSize - 26);
    const maxLen = Math.max(60, H - petSize - 8);
    const rest = Math.min(maxLen, Math.max(60, baseRest * (ropeLengthPct / 100)));
    ropeSegLen = Math.max(1.5, rest / n);
    linkLen = ropeSegLen * (ropeCfg.stretch || 1);
    PHYS.restLen = rest;
    /* Park the cord on its static hanging curve when nothing is happening;
       mid-motion it keeps its own shape so the rope just re-settles. */
    if (PHYS.on && physEnabledMode()) {
      let settled = PHYS.nodes.length > 0;
      for (let i = 0; i < PHYS.nodes.length; i++) {
        const p = PHYS.nodes[i];
        if (Math.abs(p.vx) + Math.abs(p.vy) >= 5) { settled = false; break; }
      }
      if (settled) {
        physicsBuildNodes();
        physicsSnapRest();
      } else {
        physRestPose();
      }
    }
    ropeEl.setAttribute('width', stage.clientWidth);
    ropeEl.setAttribute('height', H);
    ropePts = []; ropePrev = [];
    const ax = ropeAnchorX();
    for (let i = 0; i <= n; i++) {
      const y = i * ropeSegLen;
      ropePts.push({ x: ax, y });
      ropePrev.push({ x: ax, y });
    }
    wakeRope();
  }

  /* One fixed Verlet substep. The accumulator in ropeTick calls this at
     PHYS_DT intervals, which keeps damping and gravity frame-rate independent.
     The speed slider drives the animations, not the rope's own physics. */
  function stepRope(h) {
    if (usingElasticRope()) return;   // the spring-mass cord IS the rope now
    const n = ropeCfg.segs;
    /* While dragging the rope is pulled between two controlled ends (anchor +
       pet), so it should read as a taut line, not a sagging chain: near-zero
       sag + extra constraint iterations keep it straight through fast window
       yanks instead of bowing and blurring the swing. */
    const iters = isDragging ? Math.max(ropeCfg.iters, 7) : ropeCfg.iters;
    /* The drawn chain follows the bob's spring rig, so its sag matches the
       user's gravity setting (clamped to a sane range so the link solver never
       buckles: 3924 px/s^2 = Earth 9.81 m/s^2 at PX_PER_M). */
    let gravScale = 1;
    if (usingElasticRope()) {
      gravScale = Math.max(0.05, Math.min(3, physGravityPx() / 3924));
    }
    const g = ROPE_GRAV * ropeCfg.grav * (isDragging ? 0.12 : 1) * gravScale * h * h;
    const ax = ropeAnchorX();
    for (let i = 1; i <= n; i++) {
      const p = ropePts[i];
      const pv = ropePrev[i];
      const vx = (p.x - pv.x) * ropeCfg.damp;
      const vy = (p.y - pv.y) * ropeCfg.damp;
      pv.x = p.x; pv.y = p.y;
      p.x += vx;
      p.y += vy + g;
    }
    ropePts[0].x = ax;
    ropePts[0].y = 0;
    for (let iter = 0; iter < iters; iter++) {
      for (let i = 1; i <= n; i++) {
        const a = ropePts[i - 1];
        const b = ropePts[i];
        const dx = b.x - a.x;
        const dy = b.y - a.y;
        const d = Math.sqrt(dx * dx + dy * dy);
        if (d < 1e-6) continue;
        const diff = (d - linkLen) / d;
        const move = diff * 0.5;
        if (i === n) {
          b.x -= dx * move;
          b.y -= dy * move;
        } else {
          a.x += dx * move;
          a.y += dy * move;
          b.x -= dx * move;
          b.y -= dy * move;
        }
      }
    }
  }

  /* One continuous cord through the physics nodes: Catmull-Rom converted to
     cubic Beziers, so the curve passes exactly through every node (no gap at
     the pet) while the rope itself still reads as a single smooth line. */
  function elasticRopePath() {
    const n = physSegCount();
    const p = PHYS.nodes;
    if (p.length < 2) return '';
    let d = 'M ' + p[0].x.toFixed(1) + ' ' + p[0].y.toFixed(1);
    for (let i = 0; i < n; i++) {
      const p0 = p[i - 1] || p[0];
      const p1 = p[i];
      const p2 = p[i + 1];
      const p3 = p[i + 2] || p2;
      const c1x = p1.x + (p2.x - p0.x) / 6;
      const c1y = p1.y + (p2.y - p0.y) / 6;
      const c2x = p2.x - (p3.x - p1.x) / 6;
      const c2y = p2.y - (p3.y - p1.y) / 6;
      d += ' C ' + c1x.toFixed(1) + ' ' + c1y.toFixed(1) + ' ' +
        c2x.toFixed(1) + ' ' + c2y.toFixed(1) + ' ' +
        p2.x.toFixed(1) + ' ' + p2.y.toFixed(1);
    }
    return d;
  }

  function drawRope() {
    const n = ropeCfg.segs;
    const at = ropeAttach();
    const cx = ropeAnchorX();

    if (usingElasticRope()) {
      /* Elastic cord: the pet rides the last NODE, and leans with the direction
         of the bottom segment (what the rope actually points at), so a stretch
         or an overhang rotates the pet exactly like the cord does. */
      const nEl = physSegCount();
      const last = physLastNode();
      const prev = PHYS.nodes[nEl - 1];
      const segDx = last && prev ? last.x - prev.x : 0;
      const segDy = last && prev ? last.y - prev.y : 1;
      const targetDeg = Math.atan2(segDx, Math.max(1, segDy)) * 180 / Math.PI;
      const rotK = 1 - Math.pow(1 - 0.6, Math.max(0.001, frameDt) * 60);
      rotateSmooth += (targetDeg - rotateSmooth) * rotK;
      petRig.style.transform =
        'translate(' + (at.x - petSize / 2).toFixed(1) + 'px,' + at.y.toFixed(1) + 'px)' +
        ' rotate(' + rotateSmooth.toFixed(2) + 'deg)';
      const starget = (at.x - cx) * 0.6;
      const shK = 1 - Math.pow(1 - 0.3, Math.max(0.001, frameDt) * 60);
      shadowSmooth += (starget - shadowSmooth) * shK;
      groundShadow.style.transform = 'translateX(calc(-50% + ' + shadowSmooth.toFixed(1) + 'px))';
    } else if (baseAnim === 'swing' && currentAnim === 'swing') {
      /* The pet hangs ON the rope end: its top-center sits exactly on the tail
         and the pendulum angle drives the swing. The rig carries this transform
         so interaction animations (bounce, jump...) compose on top of it. */
      const targetDeg = swingA * 180 / Math.PI;
      const rotK = 1 - Math.pow(1 - 0.6, Math.max(0.001, frameDt) * 60);
      rotateSmooth += (targetDeg - rotateSmooth) * rotK;
      petRig.style.transform =
        'translate(' + (at.x - petSize / 2).toFixed(1) + 'px,' + at.y.toFixed(1) + 'px)' +
        ' rotate(' + rotateSmooth.toFixed(2) + 'deg)';
      const L = ropeSegLen * ropeCfg.segs;
      const starget = Math.sin(swingA) * L * 0.6;
      const shK = 1 - Math.pow(1 - 0.3, Math.max(0.001, frameDt) * 60);
      shadowSmooth += (starget - shadowSmooth) * shK;
      groundShadow.style.transform = 'translateX(calc(-50% + ' + shadowSmooth.toFixed(1) + 'px))';
    } else {
      /* Any other animation: the pet stays hanging at the rope end (straight
         hang, no rotation) and the rope follows the pet's real position —
         knot glued to the pet, no gap, no jump when animations switch. */
      petRig.style.transform =
        'translate(' + (cx - petSize / 2).toFixed(1) + 'px,' + petHangY().toFixed(1) + 'px)';
      const starget = (at.x - cx) * 0.5;
      shadowSmooth += (starget - shadowSmooth) * 0.3;
      groundShadow.style.transform = 'translateX(calc(-50% + ' + shadowSmooth.toFixed(1) + 'px))';
    }

    knotEl.style.left = at.x + 'px';
    knotEl.style.top = at.y + 'px';

    if (usingElasticRope()) {
      /* The cord is drawn as ONE smooth curve through the physics nodes
         (Catmull-Rom expressed as cubic Beziers), so the internal nodes never
         read as separate segments, and it thins out slightly while stretched
         the way real elastic cord does. */
      const shape = physRopeShape();
      const targetThick = Math.max(0.62, Math.min(1.3, 1 / Math.max(0.5, shape.ratio)));
      const tK = 1 - Math.pow(1 - 0.15, Math.max(0.001, frameDt) * 60);
      ropeThick += (targetThick - ropeThick) * tK;
      stage.style.setProperty('--rope-thick', ropeThick.toFixed(3));
      ropePath.setAttribute('d', elasticRopePath());
      ropePath2.setAttribute('d', ropePath.getAttribute('d'));
      return;
    }

    let d = 'M ' + ropePts[0].x.toFixed(1) + ' ' + ropePts[0].y.toFixed(1);
    for (let i = 1; i < n; i++) {
      const a = ropePts[i - 1];
      const b = ropePts[i];
      d += ' Q ' + a.x.toFixed(1) + ' ' + a.y.toFixed(1) + ' ' + ((a.x + b.x) / 2).toFixed(1) + ' ' + ((a.y + b.y) / 2).toFixed(1);
    }
    /* The final segment ends exactly on the tail (the pet's attach point), not
       on a midpoint — the drawn rope can never appear a half-segment short of
       the pet, which read as "the rope lags behind / detaches" during swings. */
    {
      const a = ropePts[n - 1];
      const b = ropePts[n];
      d += ' Q ' + a.x.toFixed(1) + ' ' + a.y.toFixed(1) + ' ' + b.x.toFixed(1) + ' ' + b.y.toFixed(1);
    }
    ropePath.setAttribute('d', d);
    ropePath2.setAttribute('d', d);
  }

  /* Sleep when the rope has settled, so idle costs almost nothing (Hangly aims
     for ~1% of a core; we go one better and stop ticking entirely). */
  function ropeTick(t) {
    ropeTicking = true;
    const W = stage.clientWidth;
    const H = stage.clientHeight;
    if (W > 40 && H > 40 && (Math.abs(W - lastSizeW) > 2 || Math.abs(H - lastSizeH) > 2)) {
      lastSizeW = W;
      lastSizeH = H;
      initRope();
    }
    const dt = Math.min(0.05, Math.max(0.001, (t - lastFrame) / 1000 || 0.016));
    frameDt = dt;
    lastFrame = t;
    updateAnimOffset();
    /* Cache the (window-geometry dependent) safe swing angle once per frame
       instead of reading clientWidth inside every 240 Hz substep. */
    clampAngle = swingClampA();
    const n = ropeCfg.segs;
    /* The elastic cord runs at a shorter substep than the classic rope: its
       segment springs are far stiffer, and this is what keeps the wave stable
       and identical on 60 Hz and 144 Hz displays. */
    const sub = usingElasticRope() ? ELASTIC_DT : PHYS_DT;
    physAcc = Math.min(0.25, physAcc + dt);
    /* Cap the catch-up work per frame. A long stall (debugger, sleep, a window
       drag) must not turn into hundreds of substeps of physics in one frame. */
    let budget = usingElasticRope() ? 160 : 64;
    while (physAcc >= sub && budget-- > 0) {
      if (usingElasticRope()) {
        updateElasticPhysics(sub);
      } else {
        updateSwing(sub);
        /* Pin the rope's free end exactly where the pet hangs (anchor is the
           window-top center). One source of truth for rig, knot and rope path,
           applied every substep, so the rope never lags a frame behind the pet,
           never stretches and never opens a gap — while dragging too. */
        stepRope(sub);
        const at = ropeAttach();
        ropePts[n].x = at.x;
        ropePts[n].y = at.y;
      }
      physAcc -= sub;
    }
    if (physAcc > sub) physAcc = 0;   /* ran out of budget: drop the backlog */
    drawRope();
    if (isDragging) {
      ropeStill = 0;
    } else {
      let spd, swinging;
      if (usingElasticRope()) {
        /* "Still" means every node of the cord is at rest, not just the end.
           6 px/s is ~0.1 px per frame — below what the eye can pick up. */
        spd = 0;
        swinging = false;
        for (let i = 1; i < PHYS.nodes.length; i++) {
          const p = PHYS.nodes[i];
          const s = Math.abs(p.vx) + Math.abs(p.vy);
          if (s > spd) spd = s;
          if (s > 6) swinging = true;
        }
      } else {
        spd = Math.hypot(ropePts[n].x - ropePrev[n].x, ropePts[n].y - ropePrev[n].y);
        swinging = Math.abs(swingA) > 0.004 || Math.abs(swingV) > 0.02;
      }
      if (spd < 3 && !swinging) {
        if (++ropeStill > 40) { ropeStill = 0; ropeTicking = false; return; }
      } else {
        ropeStill = 0;
      }
    }
    requestAnimationFrame(ropeTick);
  }

  function wakeRope() {
    if (!ropeTicking) requestAnimationFrame(ropeTick);
  }

  function setSpeed(v) {
    speed = Math.max(0.2, Math.min(3, v || 1));
    const baseDur = 2.6;
    petContainer.style.setProperty('--dur', (baseDur / speed) + 's');
  }

  function updatePhysicsActive() {
    stage.classList.toggle('physics-on', baseAnim === 'swing');
  }

  function setAnim(name) {
    stage.classList.remove('anim-' + currentAnim, 'pop-stage');
    void stage.offsetWidth;
    currentAnim = name;
    stage.classList.add('anim-' + name);
    updatePhysicsActive();
    wakeRope();
  }

  function setBaseAnim(name) {
    if (name && stage) {
      baseAnim = name;
      setAnim(name);
    }
  }

  function restoreAnim(delay) {
    setTimeout(() => {
      if (stage.classList.contains('anim-' + currentAnim)) setAnim(baseAnim);
    }, delay);
  }

  function setSize(s) {
    const size = Math.max(40, Math.min(320, s || 140));
    petSize = size;
    petRig.style.width = petSize + 'px';
    petRig.style.height = petSize + 'px';
    groundShadow.style.width = (petSize * 0.6) + 'px';
    initRope();
  }

  const ROPE_COLORS = {
    brown:  ['#cfa36a', '#9e6b38', '#e9c28a', '#a9743d', '#7a471d'],
    tan:    ['#e6c48c', '#b4874e', '#f0d6a2', '#bf9259', '#8a5f2e'],
    blonde: ['#ecd9a8', '#c9b079', '#f5e6bd', '#d4bc85', '#a08d56'],
    crimson:['#c25b5b', '#8a3a3a', '#d47b7b', '#9b4747', '#632626'],
    teal:   ['#5bb8a8', '#3a7d72', '#75cdbd', '#489186', '#2b5f55'],
    cobalt: ['#6b7fc2', '#46599b', '#8496d1', '#5467aa', '#37477d']
  };
  const ROPE_TEXTURES = ['braid', 'cord', 'twist', 'ribbon'];

  /* Custom rope colors: derive the full 5-shade palette (main strand, dark
     dashes, knot highlight/mid/rim) from any hex color the user picks. */
  function hexToRgb(hex) {
    const h = hex.replace('#', '');
    const n = h.length === 3 ? h.split('').map((c) => c + c).join('') : h;
    return [parseInt(n.slice(0, 2), 16), parseInt(n.slice(2, 4), 16), parseInt(n.slice(4, 6), 16)];
  }
  function shadeHex(hex, amt) {
    const rgb = hexToRgb(hex);
    const t = amt < 0 ? 0 : 255;
    const p = Math.abs(amt);
    const mix = (c) => Math.round(c + (t - c) * p).toString(16).padStart(2, '0');
    return '#' + rgb.map(mix).join('');
  }
  const isCustomHex = (c) => typeof c === 'string' && /^#([0-9a-f]{3}|[0-9a-f]{6})$/i.test(c);

  let ropeColor = 'brown';
  let ropeTexture = 'braid';

  function applyRopeStyle(style) {
    if (!style || typeof style !== 'object') return;
    if (style.color && (ROPE_COLORS[style.color] || isCustomHex(style.color))) {
      ropeColor = style.color;
      const c = ROPE_COLORS[ropeColor] || [
        ropeColor,                   // main strand
        shadeHex(ropeColor, -0.28),  // dark dash overlay
        shadeHex(ropeColor, 0.28),   // knot highlight
        shadeHex(ropeColor, -0.10),  // knot mid
        shadeHex(ropeColor, -0.45)   // knot rim
      ];
      stage.style.setProperty('--rp1', c[0]);
      stage.style.setProperty('--rp2', c[1]);
      stage.style.setProperty('--rpk1', c[2]);
      stage.style.setProperty('--rpk2', c[3]);
      stage.style.setProperty('--rpk3', c[4]);
    }
    if (style.texture && ROPE_TEXTURES.includes(style.texture)) {
      ROPE_TEXTURES.forEach((t) => stage.classList.toggle('rope-' + t, t === style.texture));
      ropeTexture = style.texture;
      ropeCfg = ropeConfigs[ropeTexture];
      initRope();
    }
    stage.classList.remove('rope-swapping');
    void stage.offsetWidth;
    stage.classList.add('rope-swapping');
  }

  function setImage(data) {
    if (!data) return;
    if (typeof data === 'string') {
      const d = data.trim();
      const svgPos = d.indexOf('<svg');
      const isSvgMarkup = svgPos !== -1 && svgPos < 400 && !d.startsWith('data:');
      if (isSvgMarkup) {
        petSvg.innerHTML = d;
        petSvg.style.display = 'flex';
        petImg.style.display = 'none';
        return;
      }
    }
    petImg.src = data;
    petImg.style.display = 'block';
    petSvg.style.display = 'none';
  }

  function showMood(emoji, text) {
    moodBubble.textContent = emoji;
    moodBubble.title = text || '';
    moodBubble.classList.add('show');
    clearTimeout(moodTimeout);
    moodTimeout = setTimeout(() => moodBubble.classList.remove('show'), 2000);
  }

  const moodEmojis = {
    happy: '😊', excited: '🤩', sleepy: '😴', love: '😍',
    silly: '😜', cool: '😎', hungry: '🍔', angry: '😤',
    confused: '🤔', dancing: '💃'
  };

  function setMood(m) {
    const emoji = moodEmojis[m] || '😊';
    showMood(emoji, m);
  }

  function spawnParticles(count, emojis) {
    const stageRect = stage.getBoundingClientRect();
    const petRect = petContainer.getBoundingClientRect();
    const cx = petRect.left - stageRect.left + petRect.width / 2;
    const cy = petRect.top - stageRect.top + petRect.height / 2;
    for (let i = 0; i < count; i++) {
      const p = document.createElement('div');
      p.className = 'particle';
      p.textContent = emojis[Math.floor(Math.random() * emojis.length)];
      p.style.left = (cx + (Math.random() - 0.5) * 44) + 'px';
      p.style.top = (cy + (Math.random() - 0.5) * 44) + 'px';
      p.style.setProperty('--dx', ((Math.random() - 0.5) * 130) + 'px');
      p.style.setProperty('--dy', (-(Math.random() * 90 + 30)) + 'px');
      p.style.setProperty('--rot', (Math.random() * 360) + 'deg');
      stage.appendChild(p);
      setTimeout(() => p.remove(), 1050);
    }
  }

  function spawnRing(emoji) {
    const stageRect = stage.getBoundingClientRect();
    const petRect = petContainer.getBoundingClientRect();
    const cx = petRect.left - stageRect.left + petRect.width / 2;
    const cy = petRect.top - stageRect.top + petRect.height / 2;
    const r = document.createElement('div');
    r.className = 'ring';
    r.textContent = emoji || '';
    r.style.left = (cx - 11) + 'px';
    r.style.top = (cy - 11) + 'px';
    r.style.display = 'flex';
    r.style.alignItems = 'center';
    r.style.justifyContent = 'center';
    r.style.fontSize = '10px';
    stage.appendChild(r);
    setTimeout(() => r.remove(), 720);
  }

  function popStage() {
    stage.classList.remove('pop-stage');
    void stage.offsetWidth;
    stage.classList.add('pop-stage');
  }

  function celebrateCarousel() {
    setAnim('celebrate');
    spawnRing('🎉');
    spawnParticles(8, ['⭐', '✨', '💫', '🌟']);
    setMood('love');
    setTimeout(() => spawnParticles(6, ['❤️', '💕', '💖']), 350);
    restoreAnim(1400);
  }

  const REACTIONS = [
    { anim: 'shake',  mood: 'silly',   particles: ['😜', '🤪', '😝'], delay: 800 },
    { anim: 'bounce', mood: 'happy',   particles: ['💚', '💛', '💙'], delay: 1100 },
    { anim: 'nod',    mood: 'love',    particles: ['❤️', '💕', '💗'], delay: 1100 },
    { anim: 'wiggle', mood: 'excited', particles: ['🎉', '🎊', '🎈'], delay: 1100 },
    { anim: 'wobble', mood: 'cool',    particles: ['😎', '🕶', '🤙'], delay: 1100 },
    { anim: 'jump',   mood: 'excited', particles: ['🦘', '⬆️', '⭐'], delay: 1100 },
    { anim: 'punch',  mood: 'happy',   particles: ['👊', '💥', '⭐'], delay: 1100 }
  ];

  function doReaction(anim, particles, mood, count, delay) {
    popStage();
    setAnim(anim);
    spawnParticles(count, particles);
    setMood(mood);
    restoreAnim(delay);
  }

  function randomReaction(count) {
    const r = REACTIONS[Math.floor(Math.random() * REACTIONS.length)];
    doReaction(r.anim, r.particles, r.mood, count || 5, r.delay);
  }

  // --- Window controls ---
  document.getElementById('btn-min').addEventListener('click', (e) => {
    e.stopPropagation();
    api.send('minimize-pet');
  });
  document.getElementById('btn-set').addEventListener('click', (e) => {
    e.stopPropagation();
    api.send('open-settings');
  });
  document.getElementById('btn-ct').addEventListener('click', (e) => {
    e.stopPropagation();
    api.send('toggle-clickthrough', !document.body.classList.contains('clickthrough'));
  });
  document.getElementById('btn-close').addEventListener('click', (e) => {
    e.stopPropagation();
    api.send('quit');
  });

  // Flash controls briefly on startup so users discover them
  setTimeout(() => {
    stage.classList.add('controls-visible');
    setTimeout(() => stage.classList.remove('controls-visible'), 2500);
  }, 800);

  // While click-through is on, keep the pet interactive: hovering the pet body
  // disables click-through so it can be grabbed/pushed/pulled, re-enabling when the cursor leaves.
  let touchState = false;
  let ctHoverActive = false;
  let lastMouseX = 0, lastMouseY = 0;
  function hoverAt(x, y) {
    const s = stage.getBoundingClientRect();
    const p = petContainer.getBoundingClientRect();
    const cx = s.left + s.width / 2;
    const m = ctHoverActive ? 12 : 0;
    const onPet = x >= p.left - m && x <= p.right + m &&
                  y >= p.top - m && y <= p.bottom + 10 + m;
    const onRope = !onPet && y < p.top &&
                   y >= s.top - m &&
                   Math.abs(x - cx) <= 16 + m;
    return onPet || onRope;
  }
  function setTouchState(v) {
    if (v === touchState || !document.body.classList.contains('clickthrough')) return;
    touchState = v;
    document.body.style.cursor = v ? 'grab' : '';
    api.send('set-mouse-over-pet', v);
  }

  // --- Click-through state ---
  api.on('clickthrough', (enabled) => {
    document.body.classList.toggle('clickthrough', !!enabled);
    ctHoverActive = false;
    if (enabled) {
      if (isDragging) { isDragging = false; api.send('end-drag'); }
      document.body.style.cursor = '';
      document.body.classList.remove('dragging');
      petContainer.classList.remove('dragging');
      setAnim(baseAnim);
      touchState = false;
      /* Re-grab instantly if the cursor is already sitting on the pet, so
         toggling click-through on never leaves the pet unreachably ignoring
         input until the next mouse move — switching feels immediate. */
      const over = hoverAt(lastMouseX, lastMouseY);
      api.send('set-mouse-over-pet', over);
      touchState = over;
      document.body.style.cursor = over ? 'grab' : '';
    }
  });

  document.addEventListener('mousemove', (e) => {
    lastMouseX = e.clientX; lastMouseY = e.clientY;
    if (!document.body.classList.contains('clickthrough')) { ctHoverActive = false; return; }
    /* Never flip hover state mid-drag: the main process keeps the window
       interactive for the whole drag, and re-evaluating here could drop the
       grab if the cursor outruns the pet body on a fast swipe. */
    if (isDragging) return;
    ctHoverActive = hoverAt(e.clientX, e.clientY);
    setTouchState(ctHoverActive);
  });
  document.addEventListener('mouseleave', () => { ctHoverActive = false; setTouchState(false); });

  // --- Interaction Handlers ---
  petContainer.addEventListener('mouseenter', () => {
    petContainer.style.filter = 'brightness(1.1) saturate(1.1)';
    groundShadow.style.opacity = '0.85';
  });

  petContainer.addEventListener('mouseleave', () => {
    petContainer.style.filter = '';
    groundShadow.style.opacity = '';
  });

  function beginDrag(e) {
    isDragging = true;
    dragMoved = false;
    totalDrag = 0;
    pressX = currentX = e.screenX;
    pressY = currentY = e.screenY;
    dragTargetX = e.clientX;
    dragTargetY = e.clientY;
    /* Pointer capture keeps every move event flowing to us at the cursor's
       native rate even when the cursor outruns the window or leaves it —
       fast drags can no longer be dropped or cancelled mid-flight. The
       window itself is moved by the main process (cursor-polling), so there
       is no IPC round-trip between mouse and window motion. */
    activePointerId = e.pointerId;
    try { petContainer.setPointerCapture(e.pointerId); } catch (err) { /* older builds */ }
    lastDragT = performance.now();
    dragVelX = 0;
    dragVelY = 0;
    leanSmooth = swingA;
    if (usingElasticRope()) {
      const last = physLastNode();
      const prev = last ? PHYS.nodes[PHYS.nodes.length - 2] : null;
      if (last && prev) {
        rotateSmooth = Math.atan2(last.x - prev.x, Math.max(1, last.y - prev.y)) * 180 / Math.PI;
      }
    } else {
      /* Snap the smoothed rig rotation to the grabbed angle immediately — without
         this the easing filter keeps rotating the rig for a frame or two after the
         hand-off, which reads as a tiny skip right when the drag starts. */
      rotateSmooth = swingA * 180 / Math.PI;
    }
    document.body.style.cursor = 'grabbing';
    document.body.classList.add('dragging');
    petContainer.classList.add('dragging');
    /* Defensive: with click-through on, make sure the main process knows a
       hover exists before the drag starts — the window must never flip to
       ignoring input mid-drag. */
    if (document.body.classList.contains('clickthrough')) api.send('set-mouse-over-pet', true);
    api.send('begin-drag');
    wakeRope();
    e.preventDefault();
  }

  function endDrag(released) {
    if (!isDragging) return;
    const wasMoved = dragMoved;
    /* Only the horizontal component of the flick drives the pendulum — a
       vertical flick shouldn't kick a sideways swing. */
    const flickSpeed = Math.abs(dragVelX);
    const flickDir = dragVelX >= 0 ? 1 : -1;
    isDragging = false;
    dragMoved = false;
    /* A captured pointer still delivers a click after release; swallow it so
       dragging never doubles as "poking" the pet. */
    suppressClick = wasMoved;
    document.body.style.cursor = '';
    document.body.classList.remove('dragging');
    petContainer.classList.remove('dragging');
    dragVelX = 0;
    dragVelY = 0;
    activePointerId = null;
    api.send('end-drag');
    /* Hand the window straight back to click-through after a drag ends (the
       hover detector re-grabs it the next time the cursor comes to rest on the
       pet). Without this, a released drag could leave click-through silently
       off with the cursor still over the pet. */
    if (document.body.classList.contains('clickthrough')) api.send('set-mouse-over-pet', false);
    if (released && wasMoved) {
      /* Continuous handoff: in the classic pendulum the drag spring's exact
         swingA/swingV carry over so the swing takes over seamlessly, and a fast
         horizontal flick seeds the pendulum with cursor-speed-derived angular
         velocity. On the elastic rig the release instead kicks the BOB's
         velocity — the spring does the rest (stretch, overshoot, oscillation,
         settle). */
      if (usingElasticRope()) {
        /* The hand only ever held the free end, so the flick is handed to that
