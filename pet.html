           node: the recoil then travels the whole cord (wave, recoil, overshoot)
           instead of being faked at the pet. */
        const last = physLastNode();
        if (last) {
          if (flickSpeed > 200) {
            last.vx += flickDir * Math.min(420, flickSpeed * 0.5);
            last.vy += Math.min(140, Math.max(-140, dragVelY * 0.35));
            spawnParticles(3, ['💨', '💨', '💫']);
            setMood('excited');
          } else {
            spawnParticles(3, ['💫', '✨', '💚']);
          }
        }
      } else if (flickSpeed > 200) {
        /* flickSpeed is dragVelX captured before it is zeroed below; without
           this the release kick multiplied a value that had already been reset
           to 0, so a fast release never swung the pendulum in unlocked (window
           follow) mode. Gain scaled up so an ordinary hand flick (~400-800 px/s)
           lands a satisfying, visible arc. */
        const kick = Math.min(2.0, flickSpeed * 0.0016);
        swingV = flickDir * Math.max(kick, Math.min(Math.abs(swingV), 2.0));
        spawnParticles(3, ['💨', '💨', '💫']);
        setMood('excited');
      } else {
        spawnParticles(3, ['💫', '✨', '💚']);
      }
      wakeRope();
      setAnim('swing');
      restoreAnim(0);
    }
  }

  petContainer.addEventListener('pointerdown', (e) => {
    if (e.button === 0) beginDrag(e);
  });

  document.addEventListener('pointermove', (e) => {
    if (!isDragging) return;
    const dx = e.screenX - currentX;
    const dy = e.screenY - currentY;
    const nowT = performance.now();
    const dtm = Math.max(0.008, Math.min(0.1, (nowT - lastDragT) / 1000));
    lastDragT = nowT;
    const vx = dx / dtm;
    const vy = dy / dtm;
    /* Heavier smoothing on the velocity estimate: pointer events are noisy at
       their native rate and the lean spring amplifies every spike. */
    dragVelX = dragVelX * 0.7 + (isFinite(vx) ? vx : 0) * 0.3;
    dragVelY = dragVelY * 0.7 + (isFinite(vy) ? vy : 0) * 0.3;
    currentX = e.screenX;
    currentY = e.screenY;
    dragTargetX = e.clientX;
    dragTargetY = e.clientY;
    totalDrag = Math.sqrt((currentX - pressX) ** 2 + (currentY - pressY) ** 2);
    if (totalDrag > 6) dragMoved = true;
  });

  document.addEventListener('pointerup', (e) => {
    if (activePointerId !== null && e.pointerId !== activePointerId) return;
    endDrag(true);
  });
  document.addEventListener('pointercancel', () => endDrag(false));
  window.addEventListener('blur', () => endDrag(false));

  petContainer.addEventListener('click', (e) => {
    if (isDragging) return;
    if (suppressClick) { suppressClick = false; return; }
    const now = Date.now();
    const timeSinceLast = now - lastClickTime;
    lastClickTime = now;

    if (timeSinceLast < 350) {
      celebrateCarousel();
      return;
    }

    popStage();
    const r = REACTIONS[Math.floor(Math.random() * REACTIONS.length)];
    doReaction(r.anim, r.particles, r.mood, 5, r.delay);
  });

  petContainer.addEventListener('contextmenu', (e) => {
    e.preventDefault();
    if (isDragging) return;
    // Native menu at the cursor: settings, click-through, position, quit —
    // always reachable, including while click-through mode is on.
    api.send('pet-context-menu');
  });

  // --- IPC Listeners ---
  api.on('pet-image', setImage);
  api.on('position-lock', (unlocked) => {
    positionUnlocked = !!unlocked;
    stage.classList.toggle('move-mode', positionUnlocked);
  });
  api.on('ground-shadow', (v) => {
    groundShadow.style.display = v ? '' : 'none';
  });
  api.on('animation', setBaseAnim);
  api.on('size', setSize);
  api.on('speed', setSpeed);
  api.on('mood', setMood);
  api.on('bg-color', (color) => {
    document.body.style.background = color || 'transparent';
  });
  api.on('interaction', (type) => {
    if (type === 'click') {
      randomReaction(4);
    } else if (type === 'double-click') {
      celebrateCarousel();
    } else if (type === 'right-click') {
      if (isDragging || dragMoved) return;
      popStage();
      setAnim('confused');
      spawnRing('❓');
      setMood('confused');
      restoreAnim(1100);
    }
  });
  api.on('window-motion', (m) => {
    if (!m || typeof m.dx !== 'number' || typeof m.dy !== 'number') return;
    /* While dragging, the drag spring already drives the swing; injecting the
       cursor-polled window deltas on top of it would push and pull the same
       state from two sources and make the pet shiver. */
    if (isDragging) return;
    if (usingElasticRope()) {
      /* Programmatic glides move the anchor (and therefore the whole cord's
         natural spot); the free end rides along with a gentle impulse. */
      const last = physLastNode();
      if (last) {
        last.vx += m.dx * 2.5;
        last.vy += m.dy * 2.5;
        if (last.vx > 700) last.vx = 700; else if (last.vx < -700) last.vx = -700;
        if (last.vy > 700) last.vy = 700; else if (last.vy < -700) last.vy = -700;
        wakeRope();
      }
    } else if (baseAnim === 'swing' && currentAnim === 'swing') {
      const L = Math.max(1, ropeSegLen * ropeCfg.segs);
      /* Gentle impulse for programmatic glides (Reset Position, presets): the
         moving anchor carries the pendulum along naturally without whipping it. */
      swingV += (m.dx / L) * 0.05;
      if (swingV > 3.5) swingV = 3.5;
      else if (swingV < -3.5) swingV = -3.5;
      wakeRope();
    }
  });
  api.on('rope-style', applyRopeStyle);
  api.on('physics', (cfg) => {
    if (cfg && typeof cfg === 'object' && cfg.reset) {
      physicsResetConfig();
      return;
    }
    setPhysicsFromIPC(cfg);
    wakeRope();
  });
  api.on('rope-length', (pct) => {
    const p = Math.max(40, Math.min(160, Number(pct) || 100));
    if (p !== ropeLengthPct) {
      ropeLengthPct = p;
      initRope();
    }
  });

  window.addEventListener('resize', () => {
    initRope();
  });

  // Init defaults
  setAnim('swing');
  setSpeed(1);
  setSize(140);
  updatePhysicsActive();
  initRope();
  wakeRope();

  // Default character (kitty)
  const DEFAULT_PET = `<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
    <g transform="translate(50,55)">
      <ellipse cx="0" cy="5" rx="28" ry="30" fill="#FF9F43"/>
      <ellipse cx="-12" cy="-22" rx="10" ry="16" fill="#FF9F43"/>
      <ellipse cx="-12" cy="-24" rx="6" ry="10" fill="#FDA7DF"/>
      <ellipse cx="12" cy="-22" rx="10" ry="16" fill="#FF9F43"/>
      <ellipse cx="12" cy="-24" rx="6" ry="10" fill="#FDA7DF"/>
      <circle cx="-10" cy="-4" r="5" fill="#222"/>
      <circle cx="10" cy="-4" r="5" fill="#222"/>
      <circle cx="-8" cy="-5" r="2" fill="white"/>
      <circle cx="12" cy="-5" r="2" fill="white"/>
      <ellipse cx="0" cy="3" rx="3" ry="2" fill="#FDA7DF"/>
      <line x1="-6" y1="6" x2="-25" y2="2" stroke="#FF9F43" stroke-width="1.5"/>
      <line x1="-6" y1="8" x2="-25" y2="8" stroke="#FF9F43" stroke-width="1.5"/>
      <line x1="6" y1="6" x2="25" y2="2" stroke="#FF9F43" stroke-width="1.5"/>
      <line x1="6" y1="8" x2="25" y2="8" stroke="#FF9F43" stroke-width="1.5"/>
      <path d="M-5,8 Q0,14 5,8" fill="none" stroke="#222" stroke-width="1.5"/>
      <ellipse cx="0" cy="35" rx="6" ry="4" fill="#FF9F43"/>
      <path d="M-6,35 Q-6,45 -10,48" fill="none" stroke="#FF9F43" stroke-width="4" stroke-linecap="round"/>
      <path d="M6,35 Q6,45 10,48" fill="none" stroke="#FF9F43" stroke-width="4" stroke-linecap="round"/>
    </g>
  </svg>`;
  setImage(DEFAULT_PET);
})();
</script>
</body>
</html>
